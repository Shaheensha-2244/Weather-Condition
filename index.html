<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container py-4">

        <!-- Search -->
        <form class="search-box mb-4" onsubmit="getData(event)">
            <input type="text" id="textBox" placeholder="Search for cities">
            <button type="submit">Search</button>
        </form>

        <!-- Loading -->
        <div class="text-center mb-3">
            <div class="spinner-border text-light" role="status" id="loading" style="display: none;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Weather Data -->
        <div class="row g-4" id="ref">

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://kit.fontawesome.com/8bb8003df5.js" crossorigin="anonymous"></script>

    <script src="./script.js"></script>
</body>

</html>
